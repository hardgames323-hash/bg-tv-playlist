name: Auto-Update IPTV Playlist

# This controls when the script runs
on:
  schedule:
    - cron: '17 * * * *' 
  workflow_dispatch: # This adds a button so you can run it manually anytime

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run Scraper
        run: python scraper.py 

      - name: Save and Upload Playlist
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          date > update.log
          git add playlist.m3u update.log
          git commit -m "Auto-update tokens" || true
          git push
